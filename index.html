<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הלוח מאה של שובי</title>
    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Heebo:wght@300;400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <div class="background-overlay" id="bg-overlay"></div>
    <div class="app-container">
        <!-- Top Slider for past days -->
        <header class="slider-container">
            <label for="daySlider" id="sliderLabel">יום בלוח</label>
            <input type="range" id="daySlider" class="glass-slider" min="0" max="100" value="100">
        </header>

        <!-- Main Title -->
        <h1 class="main-title">עוד מאה שירים של טיילור<br><span class="sub-title">עד שנגמר הEra הזה</span></h1>

        <!-- Circular Progress Bar -->
        <main class="progress-section">
            <div class="progress-container">
                <svg class="progress-ring" width="240" height="240">
                    <circle class="progress-ring__circle-bg" stroke="transparent" stroke-width="20"
                        fill="transparent" r="108" cx="120" cy="120" />
                    <circle class="progress-ring__circle" id="progress-circle" stroke="rgba(255,255,255,0.9)" stroke-width="20"
                        fill="transparent" r="108" cx="120" cy="120" />
                </svg>
                <div class="progress-text">
                    <span class="days-number" id="days-left-val">100</span>
                    <span class="days-label">ימים נותרו</span>
                </div>
            </div>
        </main>

        <!-- Song Metadata matching iPhone lockscreen player -->
        <footer class="player-container">
            <div class="album-art-wrapper">
                <img src="" alt="Album Cover" id="album-cover" class="album-cover">
            </div>
            <div class="song-info">
                <h2 class="song-title" id="song-title">Song Title</h2>
                <h3 class="song-artist" id="song-artist">Taylor Swift</h3>
            </div>
            <button class="play-button" id="play-btn" title="Play 30s Snippet">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path id="play-icon-path" d="M8 5v14l11-7z" />
                </svg>
            </button>
            <audio id="audio-player"></audio>
        </footer>

        <a class="apple-music-btn" id="apple-music-btn" href="#" target="_blank" title="Play Full Song on Apple Music">
            <svg viewBox="0 0 170 170" width="16" height="16" fill="currentColor" class="apple-logo">
                <path
                    d="M150.37 132.06c-5.21 7.22-10.74 14.73-18.72 14.83-7.53.07-9.98-4.52-18.49-4.52-8.49 0-11.23 4.41-18.39 4.62-7.53.2-12.75-6.84-18.06-14.41-11.08-15.93-19.55-45.15-13.88-66.27 2.82-10.51 9.4-17.43 16.51-21.72 6.94-4.22 14.83-5.07 19.3-5.24 8.24-.31 15.65 3.32 19.98 6.07 5.61-4.05 14.11-7.23 22.84-6.39 9.38.74 18.06 4.3 23.36 10.61-2.03 1.34-14.07 8.24-13.88 23.96.2 18.78 16.14 24.96 17.06 25.32-.15.53-2.6 8.78-17.64 33.14M114.75 30.63c4.1-4.99 6.84-11.96 6.08-18.91-5.99.25-13.31 3.99-17.51 8.91-3.76 4.41-7.06 11.53-6.17 18.34 6.74.52 13.51-3.35 17.6-8.34" />
            </svg>
            Listen on Apple Music
        </a>
    </div>
    <script src="app.js?v=7"></script>
</body>

</html>
